<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>スパイ7分の1</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="app">

  <!-- 読み込み中 -->
  <section id="screen-loading" class="screen active">
    <p class="loading-text">接続中...</p>
  </section>

  <!-- ホーム画面 -->
  <section id="screen-home" class="screen">
    <h1 class="title">🕵️ スパイ7分の1</h1>
    <p class="subtitle">3〜7人で遊ぶ協力型心理ゲーム</p>

    <label class="field-label">ニックネーム（10文字まで）</label>
    <input id="input-nickname" maxlength="10" placeholder="例: シンヤ" />

    <button id="btn-create-room" class="btn btn-primary">ルームを作る</button>

    <div class="divider">または</div>

    <label class="field-label">ルームID</label>
    <input id="input-room-code" maxlength="5" placeholder="例: A7K3P" style="text-transform:uppercase" />
    <button id="btn-join-room" class="btn btn-secondary">ルームに参加する</button>

    <p id="home-error" class="error-text"></p>
  </section>

  <!-- ロビー(待機画面) -->
  <section id="screen-lobby" class="screen">
    <h2>ルームID: <span id="lobby-room-code" class="room-code"></span></h2>
    <p class="hint">このIDを友人に伝えてください</p>

    <p class="player-count">参加者: <span id="lobby-player-count">0</span> / 7</p>
    <ul id="lobby-player-list" class="player-list"></ul>

    <button id="btn-start-game" class="btn btn-primary" disabled>ゲーム開始</button>
    <p id="lobby-status-text" class="hint">3人集まると開始できます</p>

    <button id="btn-leave-lobby" class="btn btn-text">ルームを出る</button>
  </section>

  <!-- 役職公開画面 -->
  <section id="screen-role" class="screen">
    <div id="role-card" class="role-card">
      <p class="role-icon" id="role-icon">🙂</p>
      <h2 id="role-title">あなたはプレイヤーです</h2>
      <p id="role-desc" class="role-desc">仲間と協力してゲームを成功させよう。</p>
    </div>
    <p class="hint dev-note">
      （ここから先のミニゲーム・投票フェーズは次のステップで実装します）
    </p>
  </section>

</div>

<!-- Firebase SDK (compat版) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<script src="firebase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
